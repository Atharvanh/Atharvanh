name: Update GitHub Profile Art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "README.md", ".github/workflows/update-profile-art.yml"]
  pull_request:
    paths: ["scripts/**", "README.md", ".github/workflows/update-profile-art.yml"]

permissions:
  contents: read

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/build_profile.py
      - run: python scripts/validate_profile.py

  update-art:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_PROFILE_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch real contributions (fail without overwriting on invalid data)
        run: python scripts/fetch_contributions.py
      - name: Generate all profile assets
        run: python scripts/build_profile.py
      - run: python scripts/validate_profile.py
      - name: Commit generated assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets contrib-heatmap.svg info-card.svg retro-computer.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh real profile activity [skip ci]"
            git push
          fi
