
name: Update GitHub Profile Art

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    env:
      GH_PROFILE_USER: ${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real GitHub contributions
        run: python scripts/fetch_contributions.py

      - name: Generate animated heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
